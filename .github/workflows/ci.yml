name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Backend ────────────────────────────────────────────────────────────────
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: backend
        env:
          FLASK_ENV: testing
          JWT_SECRET_KEY: ci-test-secret-key-long-enough-123456
          DB_STORAGE: ":memory:"
          UPLOAD_DIR: /tmp/rallyriot-uploads
          OPENAI_API_KEY: ""   # AI routes are not exercised in unit tests
        run: pytest tests/ -v --tb=short

  # ── Frontend ───────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (tsc + vitest + build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/rally-club-hub-main/package-lock.json

      - name: Install dependencies
        working-directory: frontend/rally-club-hub-main
        run: npm ci --legacy-peer-deps

      - name: Type check
        working-directory: frontend/rally-club-hub-main
        run: npx tsc --noEmit

      - name: Run unit tests
        working-directory: frontend/rally-club-hub-main
        run: npm test

      - name: Production build
        working-directory: frontend/rally-club-hub-main
        env:
          VITE_API_URL: /api
        run: npm run build

  # ── Docker ─────────────────────────────────────────────────────────────────
  docker:
    name: Docker Compose build
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: docker compose build

      - name: Smoke-test health endpoint
        run: |
          docker compose up -d
          # Wait for backend to be healthy
          for i in $(seq 1 30); do
            status=$(docker inspect --format='{{.State.Health.Status}}' rallyriot-backend 2>/dev/null || echo "starting")
            echo "Health: $status (attempt $i)"
            [ "$status" = "healthy" ] && break
            sleep 3
          done
          curl --fail http://localhost:5001/api/health
          docker compose down
