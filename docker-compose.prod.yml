# Production overrides — use with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Required environment variables (set in .env or shell before running):
#   JWT_SECRET_KEY   — long random secret (openssl rand -hex 32)
#   OPENAI_API_KEY   — your OpenAI API key
#   DOMAIN           — your public domain, e.g. rally.example.com

services:
  backend:
    restart: unless-stopped
    environment:
      - FLASK_ENV=production
      - FLASK_DEBUG=0
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - DB_STORAGE=/app/data/rallyriot.sqlite
      - UPLOAD_DIR=/app/uploads
      - MAX_FILE_SIZE=5242880
    volumes:
      - backend-data:/app/data
      - backend-uploads:/app/uploads
      - backend-logs:/app/logs
    # Don't expose port directly in production — nginx proxies it
    ports: []
    expose:
      - "5000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  frontend:
    restart: unless-stopped
    # In production the frontend nginx also reverse-proxies /api → backend
    environment:
      - VITE_API_URL=/api
    ports: []
    expose:
      - "80"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  # ── Nginx reverse proxy + TLS termination ────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx-certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - frontend
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  backend-data:
  backend-uploads:
  backend-logs:
  nginx-certs:
